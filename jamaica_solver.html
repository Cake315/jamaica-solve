<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ジャマイカ（Jamaica）実現可能性＆全解法チェッカー</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    /* サイコロの目・ピップ風の立体感と押し心地 */
    .die-btn {
      transition: transform 0.08s ease, box-shadow 0.08s ease, background-color 0.12s ease;
    }
    .die-btn:active {
      transform: scale(0.93);
    }
    @keyframes popIn {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop {
      animation: popIn 0.18s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between selection:bg-indigo-100">

  <!-- メインコンテンツ（下部固定キーパッド分の余白を確保） -->
  <div class="w-full max-w-md mx-auto px-3.5 pt-3 pb-48 flex-1 flex flex-col gap-3">

    <!-- ヘッダー＆クイックアクション -->

      <div>
        <div class="flex items-center gap-1.5">
          <span class="inline-flex items-center justify-center w-6 h-6 rounded-lg bg-indigo-600 text-white font-extrabold text-xs shadow-sm">J</span>
          <h1 class="text-base font-extrabold tracking-tight text-slate-900">ジャマイカ判定機</h1>
        </div>
        <p class="text-[11px] text-slate-500 mt-0.5">四則演算・途中分数あり・単項マイナスなし</p>
      </div>
      <div class="flex items-center gap-1.5">
        <button
          id="btn-example"
          type="button"

          title="超難問の例題（61 / 3,3,4,5,6）をセット"
        >
          例題
        </button>
        <button
          id="btn-random"
          type="button"
          class="px-3 py-1.5 rounded-xl bg-indigo-600 text-white text-xs font-bold shadow-sm hover:bg-indigo-700 active:scale-95 transition flex items-center gap-1"
        >
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 12c0-1.232-.046-2.453-.138-3.662a4.006 4.006 0 00-3.7-3.7 48.678 48.678 0 00-7.324 0 4.006 4.006 0 00-3.7 3.7c-.017.22-.032.441-.046.662M19.5 12l3-3m-3 3l-3-3m-12 3c0 1.232.046 2.453.138 3.662a4.006 4.006 0 003.7 3.7 48.656 48.656 0 007.324 0 4.006 4.006 0 003.7-3.7c.017-.22.032-.441.046-.662M4.5 12l3 3m-3-3l-3 3" />
          </svg>
          ランダム振り
        </button>
      </div>
    </header>

    <!-- 1. ターゲット入力カード（色違いサイコロ2個） -->
    <section class="bg-white rounded-2xl p-3.5 shadow-xs border border-slate-200/80">
      <div class="flex items-center justify-between mb-2.5">
        <div class="flex items-center gap-1.5">

          <h2 class="text-xs font-bold text-slate-700">① 作る数字（色違い2個）</h2>
        </div>
        <div class="flex items-center gap-1.5 bg-rose-50 border border-rose-200/80 px-3 py-1 rounded-xl">
          <span class="text-[11px] font-bold text-rose-600">目標</span>
          <span id="target-display" class="text-xl font-black tracking-wider text-rose-600 leading-none">--</span>

      </div>

      <div class="space-y-2">

          <span class="w-14 shrink-0 text-[11px] font-bold text-slate-500">10の位<span class="text-[10px] font-normal block text-slate-400">(中央×10)</span></span>
          <div id="tens-buttons" class="grid grid-cols-6 gap-1.5 flex-1">

        <!-- 1の位 -->

          <span class="w-14 shrink-0 text-[11px] font-bold text-slate-500">1の位<span class="text-[10px] font-normal block text-slate-400">(外周色違い)</span></span>

            <!-- JSで1〜6ボタンを生成 -->
          </div>

      </div>
    </section>

    <!-- 2. 計算に使う5個の出目スロット -->
    <section class="bg-white rounded-2xl p-3.5 shadow-xs border border-slate-200/80">
      <div class="flex items-center justify-between mb-2.5">
        <div class="flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-indigo-500"></span>
          <h2 class="text-xs font-bold text-slate-700">② 計算に使う5個の出目</h2>
          <span id="dice-count-badge" class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-slate-100 text-slate-600">0 / 5</span>
        </div>
        <div class="flex items-center gap-1.5">
          <button
            id="btn-undo"
            type="button"
            class="px-2.5 py-1 rounded-lg bg-slate-100 text-slate-600 text-[11px] font-bold hover:bg-slate-200 active:scale-95 transition disabled:opacity-40"
            disabled
          >
            1つ戻す
          </button>
          <button
            id="btn-clear"
            type="button"
            class="px-2.5 py-1 rounded-lg bg-slate-100 text-slate-600 text-[11px] font-bold hover:bg-slate-200 active:scale-95 transition disabled:opacity-40"
            disabled
          >
            クリア
          </button>
        </div>
      </div>

      <!-- 5つのスロット -->
      <div id="dice-slots" class="grid grid-cols-5 gap-2">
        <!-- JSで5スロットを描画 -->
      </div>
      <p class="text-[11px] text-slate-400 mt-2 text-center">下のボタンで入力 ／ 入れた枠をタップで個別削除</p>
    </section>

    <!-- 3. 判定結果カード（7個揃ったら自動表示） -->
    <section id="result-section" class="bg-white rounded-2xl p-4 shadow-xs border border-slate-200/80 transition-all">
      <!-- 未入力時のプレースホルダー -->
      <div id="state-incomplete" class="py-3 text-center">
        <p class="text-sm font-bold text-slate-500">7個のサイコロを入力してください</p>
        <p id="incomplete-hint" class="text-xs text-slate-400 mt-1">目標の2個と計算用の5個が揃うと自動判定します</p>
      </div>

      <!-- 判定完了時の表示 -->
      <div id="state-complete" class="hidden space-y-3">
        <!-- ステータスバナー -->
        <div id="result-banner" class="rounded-xl p-3.5 border text-center">
          <div id="result-badge" class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-extrabold mb-1"></div>
          <div id="result-title" class="text-xl font-black tracking-tight"></div>
          <p id="result-subtitle" class="text-xs mt-1 opacity-85"></p>
        </div>

        <!-- 解法の提示ボタン -->
        <button
          id="btn-reveal"
          type="button"
          class="w-full py-3 px-4 rounded-xl font-extrabold text-sm shadow-sm transition flex items-center justify-center gap-2 active:scale-[0.98] disabled:opacity-40 disabled:pointer-events-none"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          <span id="btn-reveal-text">解法の提示</span>
        </button>

        <!-- 全解法リスト（ボタンを押すまで非表示） -->
        <div id="solutions-container" class="hidden pt-1 space-y-2">
          <div class="flex items-center justify-between border-b border-slate-100 pb-1.5">
            <span class="text-xs font-bold text-slate-600">全解法一覧（交換・結合法則を同一視）</span>
            <span id="solutions-count-label" class="text-xs font-extrabold text-indigo-600"></span>
          </div>
          <ul id="solutions-list" class="space-y-1.5 max-h-64 overflow-y-auto pr-1">
            <!-- JSで解法リストを描画 -->
          </ul>
        </div>
      </div>
    </section>

  </div>

  <!-- 画面下部固定：片手操作用 サイコロ入力キーパッド（1〜6） -->
  <div class="fixed bottom-0 inset-x-0 bg-white/95 backdrop-blur-md border-t border-slate-200 shadow-[0_-4px_20px_rgba(15,23,42,0.06)] z-30">
    <div class="w-full max-w-md mx-auto px-3.5 pt-2.5 pb-4">
      <div class="flex items-center justify-between mb-1.5 px-0.5">
        <span class="text-[11px] font-bold text-slate-500">計算用のサイコロをタップして追加</span>
        <span id="keypad-status" class="text-[11px] font-bold text-indigo-600">あと 5 個入力</span>
      </div>
      <div id="dice-keypad" class="grid grid-cols-6 gap-2">
        <!-- JSで1〜6の大きなサイコロボタンを生成 -->
      </div>
    </div>
  </div>

  <script>
    /**
     * ============================================================================
     * 1. BigInt 厳密有理数演算 - 浮動小数点誤差・整数オーバーフローを完全に排除
     * ============================================================================
     */
    function bigGcd(a, b) {
      a = a < 0n ? -a : a;
      b = b < 0n ? -b : b;
      while (b !== 0n) {
        const t = b;
        b = a % b;
        a = t;
      }
      return a;
    }

    function makeFrac(num, den = 1n) {
      if (den === 0n) throw new Error("Division by zero");
      if (den < 0n) {
        num = -num;
        den = -den;
      }
      if (num === 0n) return { num: 0n, den: 1n };
      const g = bigGcd(num, den);
      return { num: num / g, den: den / g };
    }

    function fracAdd(a, b) {
      return makeFrac(a.num * b.den + b.num * a.den, a.den * b.den);
    }

    function fracSub(a, b) {
      return makeFrac(a.num * b.den - b.num * a.den, a.den * b.den);
    }

    function fracMul(a, b) {
      return makeFrac(a.num * b.num, a.den * b.den);
    }

    function fracDiv(a, b) {
      if (b.num === 0n) throw new Error("Division by zero");
      return makeFrac(a.num * b.den, a.den * b.num);
    }

    // a >= b の判定（単項マイナス防止用）
    function fracGte(a, b) {
      return a.num * b.den >= b.num * a.den;
    }

    function fracEqualsInt(a, nBig) {
      return a.den === 1n && a.num === nBig;
    }

    /**
     * ============================================================================
     * 2. 構文木正規化＆ビットDPソルバー
     *    - 交換法則・結合法則・同値な数字の入れ替えを1通りに集約
     *    - 単項マイナスなし (A >= B のみ減算許可)
     *    - sub1 < sub2 に対して6演算すべて（非可換の逆順含む）を漏れなく評価
     * ============================================================================
     */
    function compareKey(a, b) {
      if (a.key < b.key) return -1;
      if (a.key > b.key) return 1;
      return 0;
    }

    function makeNum(n) {
      const val = makeFrac(BigInt(n), 1n);
      return {
        type: "NUM",
        val,
        numVal: n,
        key: `N:${val.num}/${val.den}`
      };
    }

    function makeAdd(posList, negList) {
      let val = makeFrac(0n, 1n);
      for (const e of posList) val = fracAdd(val, e.val);
      for (const e of negList) val = fracSub(val, e.val);

      const posSorted = [...posList].sort(compareKey);
      const negSorted = [...negList].sort(compareKey);
      const key = `A:[${posSorted.map(e => e.key).join(",")}]:[${negSorted.map(e => e.key).join(",")}]`;

      return {
        type: "ADD",
        val,
        pos: posSorted,
        neg: negSorted,
        key
      };
    }

    function makeMul(numList, denList) {
      let val = makeFrac(1n, 1n);
      for (const e of numList) val = fracMul(val, e.val);
      for (const e of denList) val = fracDiv(val, e.val);

      const numSorted = [...numList].sort(compareKey);
      const denSorted = [...denList].sort(compareKey);
      const key = `M:[${numSorted.map(e => e.key).join(",")}]:[${denSorted.map(e => e.key).join(",")}]`;

      return {
        type: "MUL",
        val,
        num: numSorted,
        den: denSorted,
        key
      };
    }

    function combineExpr(e1, e2) {
      const results = [];

      const pos1 = e1.type === "ADD" ? e1.pos : [e1];
      const neg1 = e1.type === "ADD" ? e1.neg : [];
      const pos2 = e2.type === "ADD" ? e2.pos : [e2];
      const neg2 = e2.type === "ADD" ? e2.neg : [];

      // 1) e1 + e2
      results.push(makeAdd([...pos1, ...pos2], [...neg1, ...neg2]));

      // 2) e1 - e2 (単項マイナス防止のため e1 >= e2 のみ)
      if (fracGte(e1.val, e2.val)) {
        results.push(makeAdd([...pos1, ...neg2], [...neg1, ...pos2]));
      }

      // 3) e2 - e1 (単項マイナス防止のため e2 >= e1 のみ)
      if (fracGte(e2.val, e1.val)) {
        results.push(makeAdd([...pos2, ...neg1], [...neg2, ...pos1]));
      }

      const num1 = e1.type === "MUL" ? e1.num : [e1];
      const den1 = e1.type === "MUL" ? e1.den : [];
      const num2 = e2.type === "MUL" ? e2.num : [e2];
      const den2 = e2.type === "MUL" ? e2.den : [];

      // 4) e1 × e2
      results.push(makeMul([...num1, ...num2], [...den1, ...den2]));

      // 5) e1 ÷ e2 (ゼロ除算防止)
      if (e2.val.num !== 0n) {
        results.push(makeMul([...num1, ...den2], [...den1, ...num2]));
      }

      // 6) e2 ÷ e1 (ゼロ除算防止)
      if (e1.val.num !== 0n) {
        results.push(makeMul([...num2, ...den1], [...den2, ...num1]));
      }

      return results;
    }

    function formatExpr(expr) {
      if (expr.type === "NUM") {
        return String(expr.numVal);
      }
      if (expr.type === "ADD") {
        const posStr = expr.pos.map(formatExpr).join(" + ");
        const negStr = expr.neg.map(e => ` - ${formatExpr(e)}`).join("");
        return posStr + negStr;
      }
      if (expr.type === "MUL") {
        const numStrs = expr.num.map(e =>
          e.type === "ADD" ? `(${formatExpr(e)})` : formatExpr(e)
        );
        const denStrs = expr.den.map(e =>
          e.type === "ADD" ? `(${formatExpr(e)})` : formatExpr(e)
        );
        const numPart = numStrs.join(" × ");
        if (denStrs.length === 0) return numPart;
        if (denStrs.length === 1) return `${numPart} ÷ ${denStrs[0]}`;
        return `${numPart} ÷ (${denStrs.join(" × ")})`;
      }
      return "";
    }

    function solveJamaica(dice, target) {
      const n = dice.length;
      const totalMasks = 1 << n;
      const dp = Array.from({ length: totalMasks }, () => new Map());

      for (let i = 0; i < n; i++) {
        const expr = makeNum(dice[i]);
        dp[1 << i].set(expr.key, expr);
      }

      for (let mask = 1; mask < totalMasks; mask++) {
        let sub1 = (mask - 1) & mask;
        while (sub1 > 0) {
          const sub2 = mask ^ sub1;
          if (sub1 < sub2) {
            const map1 = dp[sub1];
            const map2 = dp[sub2];
            for (const e1 of map1.values()) {
              for (const e2 of map2.values()) {
                const combinedList = combineExpr(e1, e2);
                for (const c of combinedList) {
                  if (!dp[mask].has(c.key)) {
                    dp[mask].set(c.key, c);
                  }
                }
              }
            }
          }
          sub1 = (sub1 - 1) & mask;
        }
      }

      const targetBig = BigInt(target);
      const fullMap = dp[totalMasks - 1];
      const matched = [];
      for (const expr of fullMap.values()) {
        if (fracEqualsInt(expr.val, targetBig)) {
          matched.push(expr);
        }
      }

      matched.sort(compareKey);
      return matched.map(formatExpr);
    }

    /**
     * ============================================================================
     * 3. UI状態管理＆インタラクション
     * ============================================================================
     */
    const state = {
      tens: null,        // 1〜6 (10の位)
      ones: null,        // 1〜6 (1の位)
      dice: [],          // 1〜6 の配列 (最大5個)
      solutions: [],     // 計算された全解法文字列の配列
      revealed: false    // 解法を表示中かどうか
    };

    // DOM要素の参照
    const tensContainer = document.getElementById("tens-buttons");
    const onesContainer = document.getElementById("ones-buttons");
    const targetDisplay = document.getElementById("target-display");
    const diceSlotsContainer = document.getElementById("dice-slots");
    const diceCountBadge = document.getElementById("dice-count-badge");
    const btnUndo = document.getElementById("btn-undo");
    const btnClear = document.getElementById("btn-clear");
    const btnExample = document.getElementById("btn-example");
    const btnRandom = document.getElementById("btn-random");

    const stateIncomplete = document.getElementById("state-incomplete");
    const incompleteHint = document.getElementById("incomplete-hint");
    const stateComplete = document.getElementById("state-complete");
    const resultBanner = document.getElementById("result-banner");
    const resultBadge = document.getElementById("result-badge");
    const resultTitle = document.getElementById("result-title");
    const resultSubtitle = document.getElementById("result-subtitle");
    const btnReveal = document.getElementById("btn-reveal");
    const btnRevealText = document.getElementById("btn-reveal-text");
    const solutionsContainer = document.getElementById("solutions-container");
    const solutionsCountLabel = document.getElementById("solutions-count-label");
    const solutionsList = document.getElementById("solutions-list");

    const diceKeypad = document.getElementById("dice-keypad");
    const keypadStatus = document.getElementById("keypad-status");

    // サイコロの目（ピップ）SVG生成ヘルパー
    function createDieFaceSVG(num, colorClass = "text-slate-800") {
      const pipCoords = {
        1: [[12, 12]],
        2: [[7, 7], [17, 17]],
        3: [[7, 7], [12, 12], [17, 17]],
        4: [[7, 7], [17, 7], [7, 17], [17, 17]],
        5: [[7, 7], [17, 7], [12, 12], [7, 17], [17, 17]],
        6: [[7, 6.5], [17, 6.5], [7, 12], [17, 12], [7, 17.5], [17, 17.5]]
      };
      const circles = pipCoords[num]
        .map(([cx, cy]) => {
          const r = num === 1 ? 2.7 : 2.0;
          const fill = num === 1 ? "#e11d48" : "currentColor";
          return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}" />`;
        })
        .join("");
      return `<svg class="w-6 h-6 ${colorClass}" viewBox="0 0 24 24" aria-hidden="true">${circles}</svg>`;
    }

    // 初期化：10の位・1の位・下部キーパッドのボタン生成
    function initButtons() {
      for (let n = 1; n <= 6; n++) {
        // 10の位ボタン
        const tBtn = document.createElement("button");
        tBtn.type = "button";
        tBtn.dataset.val = n;
        tBtn.textContent = n;
        tBtn.className = "die-btn h-9 rounded-xl font-extrabold text-sm border transition flex items-center justify-center";
        tBtn.addEventListener("click", () => {
          state.tens = state.tens === n ? null : n;
          state.revealed = false;
          updateAll();
        });
        tensContainer.appendChild(tBtn);

        // 1の位ボタン
        const oBtn = document.createElement("button");
        oBtn.type = "button";
        oBtn.dataset.val = n;
        oBtn.textContent = n;
        oBtn.className = "die-btn h-9 rounded-xl font-extrabold text-sm border transition flex items-center justify-center";
        oBtn.addEventListener("click", () => {
          state.ones = state.ones === n ? null : n;
          state.revealed = false;
          updateAll();
        });
        onesContainer.appendChild(oBtn);

        // 下部固定：計算用サイコロ入力キーパッド（1〜6）
        const kBtn = document.createElement("button");
        kBtn.type = "button";
        kBtn.dataset.val = n;
        kBtn.className =
          "die-btn h-14 rounded-2xl bg-white border-2 border-slate-200 shadow-xs hover:border-indigo-400 hover:bg-indigo-50/40 flex flex-col items-center justify-center gap-0.5 disabled:opacity-40 disabled:pointer-events-none";
        kBtn.innerHTML = `
          ${createDieFaceSVG(n)}
          <span class="text-[11px] font-black text-slate-700 leading-none">${n}</span>
        `;
        kBtn.addEventListener("click", () => {
          if (state.dice.length < 5) {
            state.dice.push(n);
            state.revealed = false;
            updateAll();
          }
        });
        diceKeypad.appendChild(kBtn);
      }
    }

    // 全体の再描画＆自動判定
    function updateAll() {
      // 1. ターゲットボタンの選択状態更新
      Array.from(tensContainer.children).forEach(btn => {
        const val = Number(btn.dataset.val);
        const active = state.tens === val;
        btn.className = active
          ? "die-btn h-9 rounded-xl font-extrabold text-sm bg-rose-600 text-white border-rose-600 shadow-xs flex items-center justify-center"
          : "die-btn h-9 rounded-xl font-extrabold text-sm bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100 flex items-center justify-center";
      });

      Array.from(onesContainer.children).forEach(btn => {
        const val = Number(btn.dataset.val);
        const active = state.ones === val;
        btn.className = active
          ? "die-btn h-9 rounded-xl font-extrabold text-sm bg-rose-600 text-white border-rose-600 shadow-xs flex items-center justify-center"
          : "die-btn h-9 rounded-xl font-extrabold text-sm bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100 flex items-center justify-center";
      });

      // ターゲット数値の表示
      if (state.tens !== null && state.ones !== null) {
        targetDisplay.textContent = `${state.tens}${state.ones}`;
      } else if (state.tens !== null) {
        targetDisplay.textContent = `${state.tens}_`;
      } else if (state.ones !== null) {
        targetDisplay.textContent = `_${state.ones}`;
      } else {
        targetDisplay.textContent = "--";
      }

      // 2. 計算用5スロットの描画
      diceSlotsContainer.innerHTML = "";
      for (let i = 0; i < 5; i++) {
        const val = state.dice[i];
        const slot = document.createElement("button");
        slot.type = "button";
        if (val !== undefined) {
          slot.className =
            "animate-pop h-14 rounded-2xl bg-indigo-50 border-2 border-indigo-500 text-indigo-900 font-black text-xl shadow-xs flex flex-col items-center justify-center relative group active:scale-95 transition";
          slot.innerHTML = `
            <span>${val}</span>
            <span class="text-[9px] font-bold text-indigo-400 leading-none mt-0.5">削除</span>
          `;
          slot.addEventListener("click", () => {
            state.dice.splice(i, 1);
            state.revealed = false;
            updateAll();
          });
        } else {
          slot.className =
            "h-14 rounded-2xl bg-slate-50 border-2 border-dashed border-slate-200 text-slate-300 font-bold text-sm flex items-center justify-center cursor-default";
          slot.textContent = i + 1;
          slot.disabled = true;
        }
        diceSlotsContainer.appendChild(slot);
      }

      // カウント・操作ボタン状態の更新
      const count = state.dice.length;
      diceCountBadge.textContent = `${count} / 5`;
      btnUndo.disabled = count === 0;
      btnClear.disabled = count === 0 && state.tens === null && state.ones === null;

      // 下部キーパッドの有効/無効と残り個数表示
      const isFull = count >= 5;
      Array.from(diceKeypad.children).forEach(btn => {
        btn.disabled = isFull;
      });
      if (isFull) {
        keypadStatus.textContent = "5個入力完了！";
        keypadStatus.className = "text-[11px] font-bold text-emerald-600";
      } else {
        keypadStatus.textContent = `あと ${5 - count} 個入力`;
        keypadStatus.className = "text-[11px] font-bold text-indigo-600";
      }

      // 3. 7個すべて揃っているかチェックして自動判定
      const isReady = state.tens !== null && state.ones !== null && count === 5;
      if (!isReady) {
        stateIncomplete.classList.remove("hidden");
        stateComplete.classList.add("hidden");
        solutionsContainer.classList.add("hidden");

        const missing = [];
        if (state.tens === null) missing.push("10の位");
        if (state.ones === null) missing.push("1の位");
        if (count < 5) missing.push(`計算用の出目（残り${5 - count}個）`);
        incompleteHint.textContent = `未入力: ${missing.join("・")}`;
        return;
      }

      // ソルバー実行
      const target = state.tens * 10 + state.ones;
      state.solutions = solveJamaica(state.dice, target);
      const solCount = state.solutions.length;

      stateIncomplete.classList.add("hidden");
      stateComplete.classList.remove("hidden");

      // 判定バナーのスタイリング（0通り / 1通り / 2通り以上）
      if (solCount === 0) {
        resultBanner.className = "rounded-xl p-3.5 border border-slate-200 bg-slate-50 text-slate-700 text-center animate-pop";
        resultBadge.className = "inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-extrabold mb-1 bg-slate-200 text-slate-700";
        resultBadge.textContent = "NO SOLUTION";
        resultTitle.textContent = "作成不可能（0 通り）";
        resultTitle.className = "text-xl font-black tracking-tight text-slate-800";
        resultSubtitle.textContent = "四則演算をどう組み合わせてもこの数字は作れません。";

        btnReveal.disabled = true;
        btnReveal.className = "w-full py-3 px-4 rounded-xl font-extrabold text-sm bg-slate-100 text-slate-400 flex items-center justify-center gap-2";
        btnRevealText.textContent = "解法の提示（解なし）";
      } else if (solCount === 1) {
        resultBanner.className = "rounded-xl p-3.5 border-2 border-amber-400 bg-gradient-to-br from-amber-50 to-orange-50 text-amber-950 text-center animate-pop";
        resultBadge.className = "inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-extrabold mb-1 bg-amber-500 text-white shadow-2xs";
        resultBadge.textContent = "★ 激レア・唯一解 ★";
        resultTitle.textContent = "作成可能！（全 1 通り）";
        resultTitle.className = "text-xl font-black tracking-tight text-amber-900";
        resultSubtitle.textContent = "たった1ルートしか正解が存在しない超難問パターンです！";

        btnReveal.disabled = false;
        btnReveal.className = "w-full py-3 px-4 rounded-xl font-extrabold text-sm bg-amber-500 hover:bg-amber-600 text-white shadow-sm transition flex items-center justify-center gap-2 active:scale-[0.98]";
        btnRevealText.textContent = state.revealed ? "解法を隠す" : "解法の提示（全 1 通り）";
      } else {
        resultBanner.className = "rounded-xl p-3.5 border border-emerald-200 bg-emerald-50/80 text-emerald-950 text-center animate-pop";
        resultBadge.className = "inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-extrabold mb-1 bg-emerald-600 text-white";
        resultBadge.textContent = "SOLVABLE";
        resultTitle.textContent = `作成可能！（全 ${solCount} 通り）`;
        resultTitle.className = "text-xl font-black tracking-tight text-emerald-900";
        resultSubtitle.textContent = "まずは自力で計算に挑戦してから解法を確認できます。";

        btnReveal.disabled = false;
        btnReveal.className = "w-full py-3 px-4 rounded-xl font-extrabold text-sm bg-indigo-600 hover:bg-indigo-700 text-white shadow-sm transition flex items-center justify-center gap-2 active:scale-[0.98]";
        btnRevealText.textContent = state.revealed ? "解法を隠す" : `解法の提示（全 ${solCount} 通り）`;
      }

      // 解法リストの表示切り替え
      if (state.revealed && solCount > 0) {
        solutionsContainer.classList.remove("hidden");
        solutionsCountLabel.textContent = `全 ${solCount} パターン`;
        solutionsList.innerHTML = state.solutions
          .map(
            (exprStr, idx) => `
            <li class="flex items-center justify-between bg-slate-50 border border-slate-200/80 rounded-xl px-3 py-2 text-sm">
              <span class="font-mono font-bold text-slate-800">
                <span class="text-xs font-sans font-bold text-slate-400 mr-1.5">${idx + 1}.</span>${exprStr} = <span class="text-rose-600 font-black">${target}</span>
              </span>
            </li>`
          )
          .join("");
      } else {
        solutionsContainer.classList.add("hidden");
      }
    }

    // コントロールボタンのイベント登録
    btnUndo.addEventListener("click", () => {
      if (state.dice.length > 0) {
        state.dice.pop();
        state.revealed = false;
        updateAll();
      }
    });

    btnClear.addEventListener("click", () => {
      state.tens = null;
      state.ones = null;
      state.dice = [];
      state.solutions = [];
      state.revealed = false;
      updateAll();
    });

    btnReveal.addEventListener("click", () => {
      if (state.solutions.length > 0) {
        state.revealed = !state.revealed;
        updateAll();
      }
    });

    // 例題セット（話題になった超難問：61 / 3,3,4,5,6）
    btnExample.addEventListener("click", () => {
      state.tens = 6;
      state.ones = 1;
      state.dice = [3, 3, 4, 5, 6];
      state.revealed = false;
      updateAll();
    });

    // ランダムに7個すべて振る
    btnRandom.addEventListener("click", () => {
      const roll = () => Math.floor(Math.random() * 6) + 1;
      state.tens = roll();
      state.ones = roll();
      state.dice = [roll(), roll(), roll(), roll(), roll()];
      state.revealed = false;
      updateAll();
    });

    // 初期描画
    initButtons();
    updateAll();
  </script>
</body>
</html>
